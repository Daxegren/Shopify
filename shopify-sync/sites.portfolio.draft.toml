# UTKAST för övriga butiker. Läses inte av något jobb (jobben läser sites.toml). Fyll i alla TODO, flytta ett block i taget
# till sites.toml när butikens åtkomst (Shopify, Search Console, GA4) är ordnad, och följ docs/ny-sajt.md.
#
# Regler:
#  - En butik = en uppsättning GA4-, annons- och Shopify-tabeller. Alla domäner i butiken har samma data_key.
#  - En domän = ett [[site]] (egen genomlysning och Search Console). Sajten med growth_views = true äger butikens vyer och
#    är den som har ga4_property_id, annonskonton och shopify_dataset.
#  - Butiker som tillhör ett annat bolag än Gorilla Sports får eget Google Cloud-projekt (bq_project), enligt docs/ny-sajt.md.
#  - Bransch (vertical) är en gissning utifrån namnet och ska bekräftas.
# Läggs inte i sites.toml förrän allt är ifyllt: SITES=all i nattjobbet genomlyser alla sajter där.

[defaults]
bq_dataset = "site_audit"
api_version = "2026-07"

