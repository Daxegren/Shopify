[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-sync"
version = "0.1.0"
description = "Synk av Shopify-data till BigQuery/Postgres och genomlysning av Shopify-sajter."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.14"]
postgres = ["psycopg[binary]>=3.1"]
all = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.14", "psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
shopify-sync = "shopify_sync.main:main"
site-audit = "site_audit.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
