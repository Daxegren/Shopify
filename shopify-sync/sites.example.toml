# Konfiguration för site-audit. Kopiera till sites.toml och anpassa.
# Gemensamma värden ligger i [defaults]; varje [[site]] kan skriva över dem.

[defaults]
bq_project = "gorilla-sports-data"
bq_dataset = "site_audit"
api_version = "2026-07"

[defaults.crawl]
max_pages = 5000
requests_per_second = 3.0
concurrency = 4
max_link_depth = 2
geo_probe_paths = ["/", "/collections/all"]

[defaults.thresholds]
html_bytes_warn = 1000000
inline_script_bytes_warn = 100000
hreflang_variants_warn = 12

[[site]]
name = "gorillasports-se"
base_url = "https://www.gorillasports.se"
shop_domain = "gs-nordic-production.myshopify.com"
shopify_token_env = "SHOPIFY_ACCESS_TOKEN"       # läses från miljön/Secret Manager
brand_terms = ["Gorilla Sports", "Gorilla"]
primary_locale = "sv"
expected_locales = ["sv", "da"]
expected_org_schema = ["Organization", "OnlineStore", "Store", "SportingGoodsStore"]
# Vyn gsc_combined (sql/audit/views.sql) slår ihop API-historik och bulkexport.
gsc_table = "gorilla-sports-data.site_audit.gsc_combined_gorillasports_se"
gsc_property = "sc-domain:gorillasports.se"          # eller "https://www.gorillasports.se/"
ga4_property_id = "000000000"                        # GA4-egendomens id (siffror)
ga4_api_table = "gorilla-sports-data.site_audit.ga4_landing_daily_gorillasports_se"
ga4_dataset = "gorilla-sports-data.analytics_000000000"  # byt till ert egendoms-id
shopify_dataset = "gorilla-sports-data.shopify"
# Annonser (valfritt). Konto-id:n är inga hemligheter. Utvecklartoken och Meta-token läses från miljövariablerna
# GOOGLE_ADS_DEVELOPER_TOKEN och META_ACCESS_TOKEN (Secret Manager), se docs/tillvaxtdata.md.
# google_ads_customer_ids = ["0000000000"]
# google_ads_login_customer_id = "0000000000"        # hanterarkonto (MCC), om kontona nås via ett sådant
# meta_ad_account_ids = ["act_000000000000000"]

  [[site.geo_profiles]]
  name = "Sverige"
  accept_language = "sv-SE,sv;q=0.9"

  [[site.geo_profiles]]
  name = "Danmark"
  accept_language = "da-DK,da;q=0.9"

  [[site.page_groups]]
  name = "racks"
  pattern = "^/collections/(power-rack|racks)"

  [[site.page_groups]]
  name = "produkter"
  pattern = "^/products/"

[[site]]
name = "gorillasports-dk"
base_url = "https://www.gorillasports.dk"
shop_domain = "gs-nordic-production.myshopify.com"
brand_terms = ["Gorilla Sports"]
primary_locale = "da"
gsc_table = "gorilla-sports-data.searchconsole_dk.searchdata_url_impression"

[[site]]
name = "mankovsky"
base_url = "https://www.mankovskygallery.com"
# shop_domain och token läggs till när appen är installerad i butiken
shopify_token_env = "MANKOVSKY_SHOPIFY_TOKEN"
brand_terms = ["Mankovsky"]
known_misspellings = ["Mankosvky"]
primary_locale = "sv"
expected_locales = ["sv", "en"]
expected_org_schema = ["ArtGallery", "Organization"]

  [[site.page_groups]]
  name = "konstnarer"
  pattern = "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?(collections|pages)/(artist|konstnar)"
