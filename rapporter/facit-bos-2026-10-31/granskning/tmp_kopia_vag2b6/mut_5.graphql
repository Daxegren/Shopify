mutation {
  p1: productUpdate(product: {id: "gid://shopify/Product/10650167607562", title: "Stänkskärmar SKS Beavertail XL, 26–28 tum, Svart", seo: {title: "Stänkskärmar SKS Beavertail XL, 26–28 tum", description: "SKS Beavertail XL är en uppsättning stänkskärmar för mountainbikes med 26–28-tumshjul. Enligt tillverkaren passar de däck upp till 58 mm och väger 195 g."}, descriptionHtml: "<p>SKS Beavertail XL är en uppsättning stänkskärmar, en fram och en bak, för mountainbikes med hjul på 26–28 tum. Enligt tillverkaren passar de däck upp till 2,2 tum (58 mm).</p><h2>Passar för</h2><ul>\n<li>Dig som har en mountainbike med hjul på 26–28 tum</li>\n<li>Dig som vill kunna ta bort stänkskärmarna från fästena utan verktyg</li>\n<li>Dig som cyklar i stadsmiljö, på landsväg eller på skogsstigar</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Typ: Främre och bakre stänkskärmar för mountainbikes</li>\n<li>Hjulstorlek: 26–28 tum</li>\n<li>Däckbredd: Upp till 2,2 tum / 58 mm</li>\n<li>Vikt: 195 g</li>\n<li>Färg: Svart</li>\n<li>Extra fästpunkt: Bakre stänkskärm mot sadelstolpen</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder. Beställningsvaror kan ta upp till en vecka längre.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p2: productUpdate(product: {id: "gid://shopify/Product/10650167902474", title: "Sadelväska SKS Explorer Edge, Svart", seo: {title: "Sadelväska SKS Explorer Edge, 1 l", description: "SKS Explorer Edge är en svart sadelväska i 100 % polyester med volymen 1 liter. Väskan har klickfäste och rymmer verktyg och extra innerslangar."}, descriptionHtml: "<p>SKS Explorer Edge är en svart sadelväska i polyester med volymen 1 liter. Enligt tillverkaren är väskan vattentät, och den fästs med ett klickfäste.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en sadelväska för verktyg, extra innerslangar och andra föremål</li>\n<li>Dig som vill ha en väska på 1 liter</li>\n<li>Dig som vill fästa väskan med ett klickfäste</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Material: 100 % polyester</li>\n<li>Färg: Svart</li>\n<li>Volym: 1 liter</li>\n<li>Mått: 280 x 60 x 120 mm</li>\n<li>Vikt: 164 g</li>\n<li>Fäste: Klickfäste</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder. Beställningsvaror kan ta upp till en vecka längre.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p3: productUpdate(product: {id: "gid://shopify/Product/10650168000778", title: "Smartphonehållare SKS Smartboy Plus", seo: {title: "Smartphonehållare SKS Smartboy Plus", description: "SKS Smartboy Plus är en smartphonehållare som monteras på styret utan verktyg. Den har plats för nycklar, pengar och en platt powerbank."}, descriptionHtml: "<p>SKS Smartboy Plus är en smartphonehållare som monteras på styret utan verktyg. Telefonfickan fästs i hållaren med en stark krok och kan tas loss.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en mobilhållare på styret</li>\n<li>Dig som vill ha plats för nycklar, pengar och en platt powerbank</li>\n<li>Dig som vill kunna ta loss telefonfickan från hållaren</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Montering: På styret, utan verktyg</li>\n<li>Maximal smartphone-storlek: 155 x 80 x 15 mm</li>\n<li>Vikt: 115 g</li>\n<li>Förvaring: Plats för nycklar, pengar och en platt powerbank</li>\n<li>Vattentät: Ja, enligt tillverkaren</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder. Beställningsvaror kan ta upp till en vecka längre.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p4: productUpdate(product: {id: "gid://shopify/Product/10650168099082", title: "Mobilhållare för Cykel SKS Compit Stem Mount", seo: {title: "Mobilhållare SKS Compit Stem Mount", description: "SKS Compit Stem Mount är en mobilhållare för cykel med stamfäste och justerbar betraktningsvinkel. Enligt tillverkaren är fodralet vattentätt."}, descriptionHtml: "<p>SKS Compit Stem Mount är en mobilhållare för cykel med fäste vid stammen. Hållaren har justerbar betraktningsvinkel och ett fodral som enligt tillverkaren är vattentätt.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en mobilhållare för cykel med stamfäste</li>\n<li>Dig som vill kunna justera betraktningsvinkeln</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Typ: Mobilhållare för cykel</li>\n<li>Fäste: Stamfäste (Stem Mount)</li>\n<li>Betraktningsvinkel: Justerbar</li>\n<li>Fodral: Vattentätt</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder. Beställningsvaror kan ta upp till en vecka längre.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
