  p8: productUpdate(product: {id: "gid://shopify/Product/10635765645578", title: "Cykelskydd Oxford Aquatex, Upp till 3 Cyklar", seo: {title: "Cykelskydd Oxford Aquatex, 3 Cyklar", description: "Oxford Aquatex är ett cykelskydd för upp till 3 cyklar. Enligt tillverkaren är det lämpligt både inomhus och utomhus och ger skydd mot smuts och regn."}, descriptionHtml: "<p>Oxford Aquatex är ett cykelskydd som rymmer upp till 3 cyklar. Skyddet är 200 x 105 x 110 cm och är, enligt tillverkaren, lämpligt för inomhus- och utomhusbruk.</p><h2>Passar för</h2><ul>\n<li>Dig som vill förvara upp till 3 cyklar under samma skydd</li>\n<li>Dig som vill ha ett cykelskydd för inomhus- eller utomhusbruk</li>\n<li>Dig som vill ha skydd mot smuts och regn</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Rymmer: Upp till 3 cyklar</li>\n<li>Storlek: 200 x 105 x 110 cm</li>\n<li>Användning: Inomhus och utomhus</li>\n<li>Skydd mot: Smuts och regn</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
