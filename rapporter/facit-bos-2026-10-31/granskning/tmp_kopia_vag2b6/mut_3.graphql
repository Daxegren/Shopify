  p1: productUpdate(product: {id: "gid://shopify/Product/10612572225802", title: "Vattenflaska Nils Extreme i Tritan, 600 ml, Rosa", seo: {title: "Vattenflaska Nils Extreme i Tritan", description: "Nils Extreme är en vattenflaska på 600 ml i Tritan, enligt tillverkaren BPA-fri. Flaskan är 22 cm hög, 7,5 cm i diameter och väger 130 g."}, descriptionHtml: "<p>Nils Extreme är en vattenflaska på 600 ml i Tritan. Enligt tillverkaren är den BPA-fri, går att diska i diskmaskin och tål varm vätska.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en vattenflaska i BPA-fri Tritan</li>\n<li>Dig som vill ha en vattenflaska som går att diska i diskmaskin</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Material: BPA-fri Tritan</li>\n<li>Volym: 600 ml</li>\n<li>Höjd: 22 cm</li>\n<li>Diameter: 7,5 cm</li>\n<li>Vikt: 130 g</li>\n<li>Skötsel: Kan diskas i diskmaskin</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p2: productUpdate(product: {id: "gid://shopify/Product/10612590936330", title: "Handskar Liv Supreme LF, Soap Suds", seo: {title: "Handskar Liv Supreme LF, Soap Suds", description: "Liv Supreme LF är handskar med långa fingrar, förformad tumme och längre manschett. Fingertopparna är smartphone-kompatibla och tyget har 4-vägs stretch."}, descriptionHtml: "<p>Liv Supreme LF är handskar med långa fingrar och förformad tumme. Manschetten är längre och sitter utan kardborreband, och fingertopparna är smartphone-kompatibla. Handskarna finns i storlek M och L.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha handskar med långa fingrar</li>\n<li>Dig som vill ha handskar designade för en kvinnas hand, enligt tillverkaren</li>\n<li>Dig som vill kunna ta foton med mobilen utan att ta av handskarna</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Typ: Handskar med långa fingrar</li>\n<li>Storlekar: M och L</li>\n<li>Färg: Soap Suds</li>\n<li>Tyg: TransTextura med 4-vägs stretch</li>\n<li>Tumme: Ergonomisk och förformad</li>\n<li>Manschett: Längre, utan kardborreband</li>\n<li>Fingertoppar: Tip Tech, smartphone-kompatibla</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p3: productUpdate(product: {id: "gid://shopify/Product/10612594639114", title: "Flaskhållare Liv FlexWay, Justerbar", descriptionHtml: "<p>Liv FlexWay är en justerbar flaskhållare. Tillverkaren är Giant.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en flaskhållare som går att justera</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Typ: Flaskhållare</li>\n<li>Egenskap: Justerbar</li>\n<li>Tillverkare: Giant</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
  p4: productUpdate(product: {id: "gid://shopify/Product/10624083198218", title: "Handpump SKS Airflex Explorer, Svart", seo: {title: "Handpump SKS Airflex Explorer, Svart", description: "SKS Airflex Explorer är en kompakt handpump i svart för tryck upp till 5 bar. Pumpen är kompatibel med Presta- och Schrader-ventilhuvuden."}, descriptionHtml: "<p>SKS Airflex Explorer är en kompakt handpump i svart. Pumpröret har en utdragbar slang som skruvas på ventilen för en lufttät anslutning, enligt tillverkaren.</p><h2>Passar för</h2><ul>\n<li>Dig som vill ha en kompakt handpump</li>\n<li>Dig som vill ha en pump med slang som dras ut ur pumpröret och skruvas på ventilen</li>\n<li>Dig som har Presta- eller Schrader-ventil</li>\n</ul><h2>Specifikationer</h2><ul>\n<li>Färg: Svart</li>\n<li>Vikt: 132 g</li>\n<li>Längd: 205 mm</li>\n<li>Max tryck: 5 bar / 73 psi</li>\n<li>Ventil: AV och SV</li>\n<li>Kompatibel med: Presta- och Schrader-ventilhuvuden</li>\n<li>Bas: Aluminium</li>\n<li>Handtag: Plast</li>\n</ul><h2>Leverans, retur och garanti</h2><p><strong>Frakt och leverans:</strong> Normal leveranstid är 5–8 arbetsdagar. Fraktavgiften visas i kassan. Se sidan Frakt för övriga länder.</p><p><strong>Retur:</strong> 30 dagars öppet köp. Vid ångrat köp står du för returfrakten. Vid godkänd reklamation står vi för returfrakten, kontakta kundtjänst för instruktioner.</p><p><strong>Reklamation:</strong> Du har reklamationsrätt enligt konsumentlagstiftningen i ditt land. Tillverkarens garanti anges på produkten när uppgiften finns.</p><p><strong>Säljare:</strong> BOS Latitude 60N AB, org.nr 559500-4325, Lindegårdsvägen 33, 746 36 Bålsta, info@bestofsports.se.</p>"}) { product { id } userErrors { field message } }
